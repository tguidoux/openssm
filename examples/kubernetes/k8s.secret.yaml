# Namespace and server secret used by the Kubernetes examples.
# Generate your own value, e.g.: openssl rand -hex 32
---
apiVersion: v1
kind: Namespace
metadata:
  name: openssm
---
apiVersion: v1
kind: Secret
metadata:
  name: openssm-secret
  namespace: openssm
type: Opaque
stringData:
  serverSecret: "replace-me-with-openssl-rand-hex-32"
