# Kubernetes — OpenSSM with SQLite persistence
#
# Usage:
#   kubectl apply -f examples/kubernetes/k8s.secret.yaml   # namespace + secret
#   kubectl apply -f <this file>
#   kubectl port-forward -n openssm svc/openssm 9330:9330 9331:9331
#
# See: examples/README.md
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openssm-config
  namespace: openssm
data:
  config.yaml: |
    # OpenSSM configuration — persistent (SQLite on a PVC)
    #
    # serverSecret is overridden by SSM__SERVERSECRET from openssm-secret.
    #
    # The AWS documentation example keys below are NOT secret. Replace them (and
    # serverSecret) in any shared deployment. Never commit real credentials.

    server:
      host: "0.0.0.0"
      port: 9330

    ssm:
      nodeAddress: "openssm.openssm.svc:9330"
      accountId: "123456789012"
      region: "us-east-1"
      storageType: "sqlite"
      sqlitePath: "/data/openssm.db"
      serverSecret: "dev-only-not-for-production"

    sessions:
      # session-manager-plugin only connects to ssmmessages.<region>.<domain> hosts;
      # *.localhost resolves to 127.0.0.1 on most systems.
      streamUrlBase: "ws://ssmmessages.us-east-1.localhost:9330"

    parameters:
      startup:
        - name: "/example/app/url"
          value: "https://example.com"
          type: "String"
        - name: "/example/app/password"
          value: "change-me"
          type: "SecureString"

    log:
      level: "info"

    ui:
      enabled: true
      port: 9331

    metrics:
      enabled: true
      port: 9332

    environment: "prod"

    auth:
      enabled: true
      initialCredentials:
        - label: "dev-access-key"
          accessKeyId: "AKIAIOSFODNN7EXAMPLE"
          secretAccessKey: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openssm-data
  namespace: openssm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openssm
  namespace: openssm
spec:
  replicas: 1
  strategy:
    type: Recreate  # single writer for the database
  selector:
    matchLabels:
      app: openssm
  template:
    metadata:
      labels:
        app: openssm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: openssm
          image: ghcr.io/tguidoux/openssm/openssm-server:latest
          ports:
            - {name: api, containerPort: 9330}
            - {name: ui, containerPort: 9331}
            - {name: metrics, containerPort: 9332}
            - {name: health, containerPort: 8001}
          env:
            - name: CONFIG_PATH
              value: /etc/openssm/config.yaml
            - name: SSM__SERVERSECRET
              valueFrom:
                secretKeyRef:
                  name: openssm-secret
                  key: serverSecret
          readinessProbe:
            httpGet: {path: /health, port: health}
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/openssm
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: openssm-config
        - name: data
          persistentVolumeClaim:
            claimName: openssm-data
---
apiVersion: v1
kind: Service
metadata:
  name: openssm
  namespace: openssm
spec:
  selector:
    app: openssm
  ports:
    - {name: api, port: 9330, targetPort: api}
    - {name: ui, port: 9331, targetPort: ui}
    - {name: metrics, port: 9332, targetPort: metrics}
