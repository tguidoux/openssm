{{- include "openssm.validateSecret" . -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openssm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openssm.labels" . | nindent 4 }}
type: Opaque
stringData:
  serverSecret: {{ .Values.openssm.sqs.serverSecret | quote }}
{{- end }}
