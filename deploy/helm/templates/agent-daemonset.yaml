{{- if .Values.agent.enabled }}
{{- if not .Values.agent.activationSecret }}
{{- fail "agent.activationSecret must reference a Secret with activationId and activationCode keys" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "openssm.fullname" . }}-agent
  labels:
    {{- include "openssm.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "openssm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "openssm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: OPENSSM_SERVER
              value: {{ .Values.agent.serverUrl | default (printf "http://%s.%s.svc:%v" (include "openssm.fullname" .) .Release.Namespace .Values.service.port) | quote }}
            - name: OPENSSM_ACTIVATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.activationSecret }}
                  key: activationId
            - name: OPENSSM_ACTIVATION_CODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.activationSecret }}
                  key: activationCode
            - name: OPENSSM_STATE_FILE
              value: /var/lib/openssm/agent.json
            - name: OPENSSM_DISABLE_SESSIONS
              value: {{ .Values.agent.disableSessions | quote }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/openssm
      volumes:
        # Persist the instance identity per node so restarts keep the same mi- ID.
        - name: state
          hostPath:
            path: /var/lib/openssm-{{ .Release.Name }}
            type: DirectoryOrCreate
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
