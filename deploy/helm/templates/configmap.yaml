apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openssm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openssm.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      host: {{ .Values.openssm.host | quote }}
      port: {{ .Values.openssm.port }}
      {{- if .Values.openssm.tls.enabled }}
      tls:
        enabled: true
        certFile: {{ .Values.openssm.tls.certFile | quote }}
        keyFile: {{ .Values.openssm.tls.keyFile | quote }}
      {{- end }}
    ssm:
      nodeAddress: {{ .Values.openssm.ssm.nodeAddress | default (printf "%s.%s.svc:%v" (include "openssm.fullname" .) .Release.Namespace .Values.service.port) | quote }}
      accountId: {{ .Values.openssm.ssm.accountId | quote }}
      region: {{ .Values.openssm.ssm.region | quote }}
      storageType: {{ .Values.openssm.ssm.storageType | quote }}
      {{- if eq .Values.openssm.ssm.storageType "sqlite" }}
      sqlitePath: {{ .Values.openssm.ssm.sqlitePath | quote }}
      {{- end }}
      {{- if eq .Values.openssm.ssm.storageType "badger" }}
      badgerPath: {{ .Values.openssm.ssm.badgerPath | quote }}
      {{- end }}
      # serverSecret is loaded from the Kubernetes Secret via the SSM__SERVERSECRET env var
    kms:
      autoCreateKeys: {{ .Values.openssm.kms.autoCreateKeys }}
      {{- with .Values.openssm.kms.keys }}
      keys:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    parameters:
      defaultTier: {{ .Values.openssm.parameters.defaultTier | quote }}
      maxStandardParameters: {{ .Values.openssm.parameters.maxStandardParameters }}
      maxAdvancedParameters: {{ .Values.openssm.parameters.maxAdvancedParameters }}
      {{- with .Values.openssm.parameters.startup }}
      startup:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    agents:
      pingTimeoutSeconds: {{ .Values.openssm.agents.pingTimeoutSeconds }}
    sessions:
      streamUrlBase: {{ .Values.openssm.sessions.streamUrlBase | quote }}
    log:
      level: {{ .Values.openssm.logLevel | quote }}
    health:
      port: {{ .Values.openssm.health.port }}
    ui:
      enabled: {{ .Values.openssm.ui.enabled }}
      port: {{ .Values.openssm.ui.port }}
    metrics:
      enabled: {{ .Values.openssm.metrics.enabled }}
      port: {{ .Values.openssm.metrics.port }}
    environment: {{ .Values.openssm.environment | quote }}
    requestLogging:
      enabled: {{ .Values.openssm.requestLogging.enabled }}
    rateLimit:
      enabled: {{ .Values.openssm.rateLimit.enabled }}
      requestsPerSecond: {{ .Values.openssm.rateLimit.requestsPerSecond }}
      burst: {{ .Values.openssm.rateLimit.burst }}
      perAction: {{ .Values.openssm.rateLimit.perAction }}
    auth:
      enabled: {{ .Values.openssm.auth.enabled }}
