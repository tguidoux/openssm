{{define "content"}}
{{with .Data}}
<p><a href="/documents">← Documents</a></p>
<h1>{{if .Edit}}New version of {{.Name}}{{else}}Create document{{end}}</h1>
<div class="card">
<form method="POST" action="/documents">
    {{if .Edit}}<input type="hidden" name="edit" value="1">{{end}}
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{.Name}}" {{if .Edit}}readonly{{end}} required placeholder="My-RunScript">
        <p class="hint">3–128 characters: letters, numbers, _ - . (names starting with AWS-, Amazon, or Amzn are reserved).</p>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="type">Document type</label>
            <select id="type" name="type" {{if .Edit}}disabled{{end}}>
                {{range $t := (list "Command" "Session" "Automation")}}<option value="{{$t}}" {{if eq $t $.Data.Type}}selected{{end}}>{{$t}}</option>{{end}}
            </select>
        </div>
        <div class="form-group">
            <label for="format">Format</label>
            <select id="format" name="format">
                {{range $f := (list "JSON" "YAML")}}<option value="{{$f}}" {{if eq $f $.Data.Format}}selected{{end}}>{{$f}}</option>{{end}}
            </select>
        </div>
        <div class="form-group">
            <label for="versionName">Version name (optional)</label>
            <input type="text" id="versionName" name="versionName" value="{{.VersionName}}">
        </div>
    </div>
    <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" rows="20" class="mono" spellcheck="false" required>{{.Content}}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">{{if .Edit}}Create version{{else}}Create document{{end}}</button>
</form>
</div>
{{end}}
{{end}}
