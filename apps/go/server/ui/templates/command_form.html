{{define "content"}}
{{with .Data}}
<p><a href="/commands">← Run Command</a></p>
<h1>Run a command</h1>
<div class="card">
<form method="POST" action="/commands">
    <div class="form-group">
        <label for="document">Command document</label>
        <select id="document" name="document">
            {{range .Documents}}<option value="{{.}}" {{if eq . $.Data.Document}}selected{{end}}>{{.}}</option>{{end}}
        </select>
    </div>
    <div class="form-group">
        <label for="commands">Commands (one per line, for AWS-RunShellScript / AWS-RunPowerShellScript)</label>
        <textarea id="commands" name="commands" rows="6" class="mono" spellcheck="false" placeholder="uname -a&#10;uptime"></textarea>
    </div>
    <div class="form-group">
        <label for="parameters">Other parameters (name=value per line)</label>
        <textarea id="parameters" name="parameters" rows="3" class="mono" spellcheck="false" placeholder="workingDirectory=/tmp"></textarea>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="executionTimeout">Execution timeout (seconds)</label>
            <input type="number" id="executionTimeout" name="executionTimeout" placeholder="3600" min="1" max="172800">
        </div>
        <div class="form-group">
            <label for="comment">Comment</label>
            <input type="text" id="comment" name="comment">
        </div>
    </div>
    <fieldset class="form-group">
        <legend>Targets</legend>
        {{if .Instances}}
        {{range .Instances}}
        <label class="checkbox-row"><input type="checkbox" name="instance" value="{{.InstanceID}}" {{if index $.Data.Selected .InstanceID}}checked{{end}}> <span class="mono">{{.InstanceID}}</span> {{.Name}} <span class="badge {{statusClass .PingStatus}}">{{.PingStatus}}</span></label>
        {{end}}
        {{else}}<p class="muted">No managed instances registered.</p>{{end}}
        <p class="hint">Or target by tag (overrides the selection above):</p>
        <div class="form-row">
            <div class="form-group"><input type="text" name="tagKey" placeholder="tag key" aria-label="Target tag key"></div>
            <div class="form-group"><input type="text" name="tagValue" placeholder="tag value" aria-label="Target tag value"></div>
        </div>
    </fieldset>
    <button type="submit" class="btn btn-primary">Run</button>
</form>
</div>
{{end}}
{{end}}
