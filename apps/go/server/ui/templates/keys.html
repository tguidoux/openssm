{{define "content"}}
<h1>KMS keys</h1>
<p class="muted">Local keys used to encrypt SecureString parameters. <span class="mono">alias/aws/ssm</span> is the default.</p>

<div class="card">
    <h2>Create key</h2>
    <form method="POST" action="/keys" class="form-row">
        <div class="form-group">
            <label for="alias">Alias</label>
            <input type="text" id="alias" name="alias" placeholder="alias/my-app">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" name="description">
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
</div>

<table class="table" id="key-table">
    <thead><tr><th>Key ID</th><th>Aliases</th><th>Description</th><th>Created</th></tr></thead>
    <tbody>
    {{range .Data}}
    <tr>
        <td data-label="Key ID" class="mono">{{.KeyID}}</td>
        <td data-label="Aliases" class="mono">{{join .Aliases ", "}}</td>
        <td data-label="Description">{{.Description}}</td>
        <td data-label="Created">{{fmtGoTime .CreatedAt}}</td>
    </tr>
    {{end}}
    </tbody>
</table>
{{end}}
